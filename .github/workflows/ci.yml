name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: ./backend

      - name: Run Backend Tests
        run: npm test
        working-directory: ./backend

      - name: Build Backend Image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/my-backend:latest ./backend

      - name: Push Backend Image
        run: docker push ghcr.io/${{ github.repository_owner }}/my-backend:latest

      - name: Build Frontend Image
        run: docker build -t ghcr.io/${{github.repository_owner}}/my-frontend:latest ./frontend

      - name: Push Frontend Image
        run: docker push ghcr.io/${{ github.repository_owner }}/my-frontend:latest

      - name: Build Success
        run: echo "Both images built successfully!"