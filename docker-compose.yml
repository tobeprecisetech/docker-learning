services:
  backend:
    build: ./backend
    container_name: backend-app
    environment:
      - PORT=5000
      - NODE_ENV=development
    # No ports exposed (Nginx handles it)

  frontend:
    build: ./frontend
    container_name: frontend-app

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend